name: Refresh board data

# Rebuilds the checked-in snapshots in src/data from the upstream feeds.
# A commit here re-triggers the Pages deployment, so the public site picks up
# the new lines on its own — this is the "backend" in the static setup.
on:
  schedule:
    # 05:30 UTC (11:00 IST) and 14:30 UTC (20:00 IST)
    - cron: "30 5,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync defense-vs-position snapshot
        run: bun scripts/sync-nba.ts

      - name: Check for PropLine key
        if: env.PROPLINE_API_KEY == ''
        run: echo "::warning::PROPLINE_API_KEY is not set, skipping the hit-rate refresh."

      # Skipped rather than failed when the secret is missing, so the DvP
      # snapshot still refreshes on a fresh fork.
      - name: Sync hit-rate board
        if: env.PROPLINE_API_KEY != ''
        run: bun scripts/sync-hit-rates.ts

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: refresh board data"
          git push
