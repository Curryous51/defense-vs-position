name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, but let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and build (no backend)
        env:
          VITE_DATA_MODE: static
        run: |
          bunx tsc -b --noEmit
          # Project sites are served from /<repo>/; user sites live at the root.
          BASE="/${GITHUB_REPOSITORY#*/}/"
          case "${GITHUB_REPOSITORY#*/}" in
            *.github.io) BASE="/" ;;
          esac
          echo "Building with base $BASE"
          bunx vite build --base="$BASE"

      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
